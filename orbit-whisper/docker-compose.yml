# Whisper — transcribe las notas de voz de WhatsApp sin que salgan del servidor.
#
# NO expone puerto al host: solo lo alcanza orbit-backend por la red interna de
# Docker (http://orbit-whisper:8788). Lo que viaja aquí son notas de voz de
# clínicas y de familias — no tiene por qué ser accesible desde fuera.
services:
  orbit-whisper:
    build: .
    container_name: orbit-whisper
    restart: unless-stopped
    environment:
      - TZ=America/Bogota
      # `medium` frente a `small`: 3 veces más lento y vale la pena igual. Sobre
      # el mismo audio, `small` convirtió "treinta y dos kilos" en "30 y los
      # kilos" y "Exclusivo videollamada" en "exclusivo y neoyamada"; `medium`
      # acertó los dos. El peso es el campo que decide el precio.
      - WHISPER_MODELO=medium
      # 4 de los 6 núcleos, MEDIDO: con 6 tarda MÁS (40 s contra 34 s), porque
      # compite con Postgres por los mismos núcleos. Subirlo no es gratis.
      - WHISPER_HILOS=4
    volumes:
      # El modelo pesa ~0,5 GB y se baja una sola vez.
      - whisper_models:/models
    networks:
      - supabase_default

networks:
  supabase_default:
    external: true

volumes:
  whisper_models:
