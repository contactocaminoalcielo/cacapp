# /etc/nginx/sites-available/orbit-api → symlink en sites-enabled
# Requiere registro DNS en Cloudflare (proxied): api.orbitacac.com → IP del VPS
server {
    listen 80;
    server_name api.orbitacac.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.orbitacac.com;

    ssl_certificate     /etc/ssl/cloudflare-orbit.pem;
    ssl_certificate_key /etc/ssl/cloudflare-orbit.key;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
