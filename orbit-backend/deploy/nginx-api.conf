# /etc/nginx/sites-available/orbit-api → symlink en sites-enabled
# Requiere registro DNS en Cloudflare (proxied): api.orbitacac.com → IP del VPS
#
# Rate-limit de los endpoints PÚBLICOS sin JWT (/portal/*: portal de imágenes y
# portal de aliados). La zona DEBE declararse en contexto http (no dentro de
# server{}). Añadir esta línea en /etc/nginx/conf.d/ratelimit.conf (o nginx.conf):
#
#   limit_req_zone $binary_remote_addr zone=portal_pub:10m rate=30r/m;
#
# 30 req/min por IP es holgado para un humano llenando un formulario y corta el
# flooding con la anon key/endpoint abierto. burst absorbe los picos del SPA.

server {
    listen 80;
    server_name api.orbitacac.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.orbitacac.com;

    ssl_certificate     /etc/ssl/cloudflare-orbit.pem;
    ssl_certificate_key /etc/ssl/cloudflare-orbit.key;

    client_max_body_size 10M;

    # Endpoints públicos (sin JWT): aplican rate-limit por IP.
    location /portal/ {
        limit_req zone=portal_pub burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
