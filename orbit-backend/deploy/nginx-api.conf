# ⚠️ CONFIG MUERTA (verificado en producción el 2026-08-05).
# `api.orbitacac.com` NUNCA tuvo registro DNS: no resuelve. Este archivo está
# instalado y habilitado en el VPS, pero ningún tráfico llega a estos server{}.
#
# El backend se publica de verdad por el sitio `orbit`:
#   /etc/nginx/sites-enabled/orbit  →  location /api/ { proxy_pass http://127.0.0.1:8787/; }
# (con la barra final, que le quita el prefijo /api). Por eso
# `https://orbit.orbitacac.com/api/health` responde y `api.orbitacac.com` no.
#
# ⚠️ Ojo también: `sites-enabled/orbit` es un ARCHIVO REAL, no un symlink a
# sites-available — los dos archivos divergieron. El que manda es el de
# sites-enabled. Y hay un `orbit.bak.<ts>` habilitado con el mismo server_name
# (nginx usa el primero y avisa por conflicto): conviene sacarlo de sites-enabled.
#
# Se conserva este archivo por si algún día se crea el DNS de api.orbitacac.com.
#
# /etc/nginx/sites-available/orbit-api → symlink en sites-enabled
#
# Rate-limit de los endpoints PÚBLICOS sin JWT (/portal/*: portal de imágenes y
# portal de aliados). La zona DEBE declararse en contexto http (no dentro de
# server{}). Añadir esta línea en /etc/nginx/conf.d/ratelimit.conf (o nginx.conf):
#
#   limit_req_zone $binary_remote_addr zone=portal_pub:10m rate=30r/m;
#
# 30 req/min por IP es holgado para un humano llenando un formulario y corta el
# flooding con la anon key/endpoint abierto. burst absorbe los picos del SPA.

server {
    listen 80;
    server_name api.orbitacac.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.orbitacac.com;

    ssl_certificate     /etc/ssl/cloudflare-orbit.pem;
    ssl_certificate_key /etc/ssl/cloudflare-orbit.key;

    client_max_body_size 10M;

    # Endpoints públicos (sin JWT): aplican rate-limit por IP.
    location /portal/ {
        limit_req zone=portal_pub burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Webhook de WhatsApp Cloud API — lo llama Meta, no un navegador.
    # Explícito (aunque el location / de abajo ya haría el proxy) para dejar la
    # ruta pública documentada y poder ajustarle límites sin tocar el resto.
    # SIN rate-limit: Meta manda ráfagas legítimas y un 429 le haría reintentar
    # el mismo evento en bucle. El filtro real es la firma HMAC en el backend.
    # Timeout corto: el handler responde 200 en milisegundos y procesa aparte;
    # si tarda más de 5s, Meta reintenta.
    location /webhook/ {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
