# Config REAL del sitio principal — copia fiel de /etc/nginx/sites-available/orbit
# en el VPS (13.140.139.61), tomada el 2026-08-05 tras normalizar el despliegue.
#
# ⚠️ ESTE es el archivo que publica el backend, no `nginx-api.conf`:
# `location /api/` hace proxy_pass a 127.0.0.1:8787/ CON BARRA FINAL, que le quita
# el prefijo /api. Por eso https://orbit.orbitacac.com/api/health llega al backend
# como /health. `api.orbitacac.com` no resuelve (ver nginx-api.conf).
#
# Historia: hasta el 2026-08-05 `sites-enabled/orbit` era un ARCHIVO REAL y no un
# symlink, así que había divergido de `sites-available/orbit` — la copia de
# sites-available estaba vieja y le faltaba TODO el bloque /api/. Enlazarla sin
# mirar habría tumbado el backend entero. Ya quedó como symlink; esta copia del
# repo existe para que la divergencia se note en un `git diff`.
#
# La zona portal_pub se declara en contexto http (ver /etc/nginx/conf.d/), no aquí:
#   limit_req_zone $orbit_solicitud_key zone=portal_pub:1m rate=30r/m;

server {
    listen 80;
    server_name orbit.orbitacac.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name orbit.orbitacac.com;

    ssl_certificate     /etc/ssl/cloudflare-orbit.pem;
    ssl_certificate_key /etc/ssl/cloudflare-orbit.key;

    root /var/www/orbit/dist;
    index index.html;

    # Backend propio (orbit-backend) — mismo dominio, sin CORS ni DNS extra
    # Portal publico de aliados (sin JWT) - rate-limit por IP
    location /api/portal/ {
        limit_req zone=portal_pub burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:8787/portal/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store";
    }
    location /api/ {
        proxy_pass         http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear archivos del PWA — Cloudflare no debe servir versiones viejas
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
        try_files $uri =404;
    }
    location ~* workbox-.*\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
