name: Aplicar migracion 030 cuadre

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-migration-030.yml"
      - "migrations/030_cuadre_editar_valor_recogido.sql"

jobs:
  apply-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Copiar migracion al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   "migrations/030_cuadre_editar_valor_recogido.sql"
          target:   "/tmp/orbit-migration-030"
          strip_components: 1
          rm:       true

      - name: Ejecutar migracion en Supabase
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/supabase/docker
            docker compose exec -T db psql -U postgres -d postgres --pset pager=off -v ON_ERROR_STOP=1 -f - < /tmp/orbit-migration-030/030_cuadre_editar_valor_recogido.sql
