name: Deploy ORBIT a Contabo

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Build de producción
        run: npm run build
        env:
          VITE_SUPABASE_URL:    ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON:   ${{ secrets.VITE_SUPABASE_ANON }}
          VITE_APP_URL:         ${{ secrets.VITE_APP_URL }}
          # CLAUDE / GEMINI / GHL ya NO se hornean en el bundle.
          # Viven server-side en las Edge Functions extraer-datos y send-whatsapp.

      - name: Deploy a Contabo via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   "dist/*"
          target:   "/var/www/orbit"
          # rm:true borraba /var/www/orbit antes de copiar, así que al desplegar
          # desaparecían los assets con hash del build anterior y toda pestaña
          # abierta desde antes moría al pedir un chunk diferido ("Failed to
          # fetch dynamically imported module: …/assets/jspdf.es.min-XXXX.js" al
          # descargar un contrato o un PDF). Con el service worker en 'prompt',
          # esas pestañas pueden llevar días con el build viejo. Dejando los
          # archivos viejos siguen funcionando hasta que el usuario actualice.
          # index.html, sw.js y el manifiesto se sobrescriben igual.
          # A cambio se acumulan builds: los poda el paso siguiente (30 días).
          rm:       false

      # Contrapeso del `rm: false` de arriba: sin esto /var/www/orbit/dist/assets
      # crece un build por despliegue y nunca se limpia.
      - name: Podar assets de builds viejos
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            DIR=/var/www/orbit/dist/assets
            [ -d "$DIR" ] || exit 0
            # Corre DESPUÉS de copiar: cada build regenera todo `dist`, así que
            # los archivos de este despliegue acaban de escribirse y `-mtime +30`
            # no los alcanza. Solo caen los assets con hash que ningún build de
            # los últimos 30 días volvió a producir — los que ya no referencia
            # ningún index.html reciente. El margen de 30 días es el que mantiene
            # viva una pestaña abierta con un build anterior (ver `rm: false`).
            find "$DIR" -type f -mtime +30 -delete
            echo "assets: $(find "$DIR" -type f | wc -l) archivos · $(du -sh "$DIR" | cut -f1)"

      - name: Deploy Edge Functions al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   "supabase/functions/*"
          target:   "/opt/supabase/docker/volumes/functions"
          strip_components: 2

      - name: Recargar Edge Functions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/supabase/docker
            docker compose restart functions

      - name: Verificar deploy
        run: echo "✅ ORBIT desplegado en https://orbit.orbitacac.com"
