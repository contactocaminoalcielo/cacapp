name: Deploy ORBIT a Contabo

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build
        env:
          VITE_SUPABASE_URL:    ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON:   ${{ secrets.VITE_SUPABASE_ANON }}
          VITE_SUPABASE_SVC:    ${{ secrets.VITE_SUPABASE_SVC }}
          VITE_APP_URL:         ${{ secrets.VITE_APP_URL }}
          VITE_CLAUDE_KEY:      ${{ secrets.VITE_CLAUDE_KEY }}
          VITE_GEMINI_KEY:      ${{ secrets.VITE_GEMINI_KEY }}
          VITE_GHL_TOKEN:       ${{ secrets.VITE_GHL_TOKEN }}
          VITE_GHL_LOCATION_ID: ${{ secrets.VITE_GHL_LOCATION_ID }}

      - name: Deploy a Contabo via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   "dist/*"
          target:   "/var/www/orbit"
          rm:       true

      - name: Verificar deploy
        run: echo "✅ ORBIT desplegado en https://orbit.orbitacac.com"
