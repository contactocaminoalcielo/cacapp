name: Aplicar migracion 063 lapices en cuadres

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-migration-063.yml"
      - "migrations/063_cuadre_ediciones_coordinador.sql"

jobs:
  apply-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Copiar migracion al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   "migrations/063_cuadre_ediciones_coordinador.sql"
          target:   "/tmp/orbit-migration-063"
          strip_components: 1
          rm:       true

      - name: Ejecutar y verificar migracion en Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/supabase/docker
            docker compose exec -T db psql -U postgres -d postgres --pset pager=off -v ON_ERROR_STOP=1 -f - < /tmp/orbit-migration-063/063_cuadre_ediciones_coordinador.sql

            docker compose exec -T db psql -U postgres -d postgres --pset pager=off -v ON_ERROR_STOP=1 <<'SQL'
            DO $$
            DECLARE
              v_nombre text;
              v_def text;
            BEGIN
              FOREACH v_nombre IN ARRAY ARRAY[
                'set_cuadre_item_valor_recogido',
                'set_cuadre_item_recargo_manual'
              ] LOOP
                SELECT pg_get_functiondef(p.oid) INTO v_def
                FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public' AND p.proname = v_nombre
                LIMIT 1;

                IF v_def IS NULL OR position('COALESCE(v_rol, 0) NOT IN (1, 6)' in v_def) = 0 THEN
                  RAISE EXCEPTION 'La RPC public.% no permite ADMIN y COORDINADOR', v_nombre;
                END IF;
                IF position('COALESCE(v_rol, 0) <> 6' in v_def) > 0 THEN
                  RAISE EXCEPTION 'La RPC public.% conserva la restriccion anterior', v_nombre;
                END IF;
              END LOOP;
            END $$;

            NOTIFY pgrst, 'reload schema';
            SELECT 'OK: migracion 063 aplicada y verificada' AS status;
            SQL

            docker compose restart rest || echo "Aviso: no se pudo reiniciar rest; la migracion ya envio NOTIFY pgrst."
