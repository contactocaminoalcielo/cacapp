name: Aplicar migracion 060 medios de pago en cuadres

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-migration-060.yml"
      - "migrations/060_cuadre_reclasificar_medios.sql"

jobs:
  apply-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Copiar migracion al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   "migrations/060_cuadre_reclasificar_medios.sql"
          target:   "/tmp/orbit-migration-060"
          strip_components: 1
          rm:       true

      - name: Ejecutar y verificar migracion en Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/supabase/docker
            docker compose exec -T db psql -U postgres -d postgres --pset pager=off -v ON_ERROR_STOP=1 -f - < /tmp/orbit-migration-060/060_cuadre_reclasificar_medios.sql

            docker compose exec -T db psql -U postgres -d postgres --pset pager=off -v ON_ERROR_STOP=1 <<'SQL'
            DO $$
            DECLARE
              v_columnas int;
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public'
                  AND p.proname = 'set_cuadre_item_medios'
              ) THEN
                RAISE EXCEPTION 'La RPC public.set_cuadre_item_medios no quedo creada';
              END IF;

              SELECT count(*) INTO v_columnas
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'cuadre_items'
                AND column_name IN ('medios_pago_original','medios_editado_en','medios_editado_por','medios_motivo');

              IF v_columnas <> 4 THEN
                RAISE EXCEPTION 'Faltan columnas de auditoria de medios: % de 4', v_columnas;
              END IF;
            END $$;

            NOTIFY pgrst, 'reload schema';
            SELECT 'OK: migracion 060 aplicada y verificada' AS status;
            SQL

            docker compose restart rest || echo "Aviso: no se pudo reiniciar rest; la migracion ya envio NOTIFY pgrst."
