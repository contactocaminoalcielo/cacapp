# ============================================================
# ORBIT — Rate limit anti-spam para el formulario público /solicitud
# Fecha: 2026-06-12 | VPS Contabo, nginx delante de Kong (:8000)
# ============================================================
# Problema: el honeypot y el límite de 20 min del formulario son solo
# client-side. Cualquiera con la anon key (pública en el bundle) puede
# hacer POST en bucle a /rest/v1/solicitudes_servicio y llenar el
# Kanban de solicitudes basura.
#
# Solución: máximo ~2 inserts por minuto por IP real del cliente.
# - Solo limita POST (key vacía = sin límite): los GET del coordinador
#   en el Kanban sobre la misma ruta NO se ven afectados.
# - El tráfico llega vía Cloudflare, así que la IP real viene en el
#   header CF-Connecting-IP (sin esto se limitaría por IP de Cloudflare
#   y un pico de clientes legítimos compartiría el mismo contador).
#
# CÓMO APLICAR (SSH al VPS):
#
# 1. Copiar la PARTE A a un archivo nuevo (contexto http, se incluye solo):
#      sudo nano /etc/nginx/conf.d/orbit_ratelimit.conf
#
# 2. Insertar la PARTE B dentro del bloque server{} de la API
#    (el que tiene server_name db.orbitacac.com), ANTES de "location / {":
#      sudo nano /etc/nginx/sites-available/supabase-api
#
# 3. Validar y recargar:
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4. Probar: 4 POST seguidos a /rest/v1/solicitudes_servicio
#    → los primeros pasan, el resto responde 429.
# ============================================================

# ───────────────────────────────────────────────────────────────
# PARTE A → /etc/nginx/conf.d/orbit_ratelimit.conf
# ───────────────────────────────────────────────────────────────

# IP real del cliente: header de Cloudflare, con fallback a la IP directa
map $http_cf_connecting_ip $orbit_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Solo los POST cuentan para el límite (key vacía = exento)
map $request_method $orbit_solicitud_key {
    POST    $orbit_client_ip;
    default "";
}

# 2 solicitudes/minuto por IP; zona de 1 MB ≈ 16k IPs simultáneas
limit_req_zone $orbit_solicitud_key zone=orbit_solicitudes:1m rate=2r/m;

# ───────────────────────────────────────────────────────────────
